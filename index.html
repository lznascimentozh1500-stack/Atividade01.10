<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Calculadora de IMC</h1>

    <form id="form-imc" novalidate>
      <label for="peso">Peso (kg)
        <input type="number" id="peso" step="0.1" min="0.1" placeholder="Ex.: 70" required>
      </label>
      <label for="altura">Altura (m)
        <input type="number" id="altura" step="0.01" min="0.1" max="2.5" placeholder="Ex.: 1.75" required>
      </label>
      <button type="submit">Calcular IMC</button>
    </form>

    <div id="erro" class="erro" role="alert" aria-live="polite"></div>
    <div id="resultado" aria-live="polite"></div>

    <div class="historico-cabecalho">
      <h2>Histórico de cálculos</h2>
      <button type="button" id="limpar-historico" class="botao-secundario">Limpar histórico</button>
    </div>
    <ul id="historico"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
